server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A aplicacao e uma SPA: qualquer rota desconhecida devolve o index.html
    # para o roteamento acontecer no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend e API na mesma origem: sem CORS e sem URL de api fixada no bundle.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
