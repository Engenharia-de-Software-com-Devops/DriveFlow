# Ambiente local com hot reload para API e frontend.
# Subir tudo: docker compose -f docker-compose.dev.yml up --build
# Aplicacao:  http://localhost:3000
name: driveflow-dev

services:
  db:
    image: postgres:16-alpine
    container_name: driveflow-dev-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driveflow}
      POSTGRES_DB: ${POSTGRES_DB:-driveflow}
    volumes:
      - dados_postgres_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driveflow} -d ${POSTGRES_DB:-driveflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        UID: "${LOCAL_UID:-1000}"
        GID: "${LOCAL_GID:-1000}"
    container_name: driveflow-dev-api
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-driveflow}:${POSTGRES_PASSWORD:-driveflow}@db:5432/${POSTGRES_DB:-driveflow}?sslmode=disable
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        UID: "${LOCAL_UID:-1000}"
        GID: "${LOCAL_GID:-1000}"
    container_name: driveflow-dev-web
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  dados_postgres_dev:
