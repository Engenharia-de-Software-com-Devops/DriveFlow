name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verificar:
    name: Backend — formatação e análise
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem formatação:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # Sem a tag, os testes de integracao nao entram na compilacao e ficariam
      # sem analise estatica nenhuma.
      - name: go vet (testes de integracao)
        working-directory: backend
        run: go vet -tags=integracao ./...

  testar-backend:
    name: Backend — testes de unidade (tests/unidade)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Baixar dependências
        working-directory: backend
        run: go mod download

      - name: Rodar testes
        working-directory: backend
        run: go test ./... -count=1

  testar-frontend:
    name: Frontend — testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Rodar testes
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --run

  testar-integracao:
    name: Backend — testes de integração (Postgres)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Subir Postgres
        run: docker compose up -d db

      - name: Aguardar banco
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U driveflow -d driveflow && exit 0
            sleep 2
          done
          exit 1

      # A tag `integracao` e obrigatoria: sem ela estes testes nao compilam e o
      # job passaria verde sem nunca ter falado com o Postgres.
      - name: Rodar testes com DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: postgres://driveflow:driveflow@localhost:5432/driveflow?sslmode=disable
        run: go test -tags=integracao ./tests/integracao/... -count=1 -v
