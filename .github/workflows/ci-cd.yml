name: CI/CD

# Esteira unica: cada etapa so comeca quando a anterior termina com sucesso.
# A ordem vai do feedback mais barato para o mais caro, entao um erro de
# formatacao falha em segundos sem gastar minutos subindo Postgres e Docker.
#
#   1. analise estatica -> 2. seguranca -> 3. testes de unidade
#   -> 4. testes de integracao -> 5. build -> 6. smoke test da stack docker
#
# Etapas 1 a 6 sao o CI e rodam em todo push e PR. As etapas 7 a 9 sao o CD,
# so em push na main: a 7 publica no Docker Hub as mesmas imagens que o smoke
# test validou (docker save/load), sem rebuild; a 8 cria a tag vX.Y.Z e a
# release no GitHub; a 9 implanta essas imagens na maquina do runner
# self-hosted.
#
# A versao sai dos Conventional Commits desde a ultima tag
# (scripts/next-version.sh), calculada uma vez no job `versao`, em paralelo
# com o CI, e vai para o /health da api, as tags do Docker Hub e a tag do git.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Um push novo na mesma branch cancela a esteira antiga, que ja esta obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DATABASE_URL_CI: postgres://driveflow:driveflow@localhost:5432/driveflow?sslmode=disable

jobs:
  # ---- Versao da release -----------------------------------------------------
  # Em PR mostra qual versao o merge vai gerar; so a main usa o valor.
  versao:
    name: 0. Versão — próxima release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versao: ${{ steps.calcular.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo e tags: a versao depende dos commits desde a ultima tag.
          fetch-depth: 0

      - name: Testar o cálculo de versão
        run: bash scripts/next-version_test.sh

      - name: Calcular a versão
        id: calcular
        run: |
          versao=$(bash scripts/next-version.sh)
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "### Próxima release: v$versao" >> "$GITHUB_STEP_SUMMARY"
          echo "Próxima release: v$versao"

  # ---- 1. Analise estatica -------------------------------------------------
  analise-estatica:
    name: 1. Análise estática
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo para comparar as migrations com a branch alvo.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem formatação:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod e go.sum organizados
        working-directory: backend
        run: go mod tidy -diff

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # Sem a tag, os testes de integracao nao entram na compilacao e ficariam
      # sem analise estatica nenhuma.
      - name: go vet (testes de integracao)
        working-directory: backend
        run: go vet -tags=integracao ./...

      - name: staticcheck
        working-directory: backend
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest -tags=integracao ./...

      # As camadas internas nao podem depender de delivery nem de repository.
      - name: Direção das dependências entre camadas
        working-directory: backend
        run: |
          fail=0
          check() {
            pkg=$1; shift
            for forbidden in "$@"; do
              if go list -deps "./internal/$pkg" | grep -q "^driveflow/backend/internal/$forbidden"; then
                echo "internal/$pkg não pode importar internal/$forbidden"
                fail=1
              fi
            done
          }
          check entities usecases delivery repository
          check usecases delivery repository
          check repository usecases delivery
          exit $fail

      - name: Toda migration up tem a down correspondente
        working-directory: backend/internal/repository/migrations
        run: |
          fail=0
          for up in *.up.sql; do
            down="${up%.up.sql}.down.sql"
            [ -f "$down" ] || { echo "Falta $down"; fail=1; }
          done
          for down in *.down.sql; do
            up="${down%.down.sql}.up.sql"
            [ -f "$up" ] || { echo "Falta $up"; fail=1; }
          done
          exit $fail

      # Migrations ja aplicadas nunca sao editadas: so arquivos novos entram.
      - name: Migrations existentes não foram alteradas
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/${{ github.base_ref }}...HEAD" -- backend/internal/repository/migrations)
          if [ -n "$changed" ]; then
            echo "Migrations existentes foram alteradas ou removidas:"
            echo "$changed"
            echo "Crie uma nova migration NNNN_descricao.up.sql/.down.sql."
            exit 1
          fi

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Checagem de tipos (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Arquivos do Docker Compose válidos
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---- 2. Seguranca ----------------------------------------------------------
  seguranca:
    name: 2. Segurança das dependências
    runs-on: ubuntu-24.04
    needs: analise-estatica
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Aponta vulnerabilidades conhecidas que o codigo realmente alcanca,
      # tanto nos modulos quanto na biblioteca padrao da versao de Go usada.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # So as dependencias que vao para o bundle de producao.
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ---- 3. Testes de unidade --------------------------------------------------
  testes-unidade:
    name: 3. Testes de unidade
    runs-on: ubuntu-24.04
    needs: seguranca
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -race pega acesso concorrente sem sincronizacao (ex.: repositorio em
      # memoria); -shuffle expoe testes que dependem da ordem de execucao.
      # Os testes ficam em tests/, entao -coverpkg mede o codigo de internal/.
      - name: Backend (race + shuffle + cobertura)
        working-directory: backend
        run: |
          go test ./... -count=1 -race -shuffle=on \
            -coverpkg=./internal/...,./pkg/... -coverprofile=cobertura-unidade.out
          echo "### Cobertura do backend (unidade)" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cobertura-unidade.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --run

  # ---- 4. Testes de integracao -----------------------------------------------
  testes-integracao:
    name: 4. Testes de integração (Postgres)
    runs-on: ubuntu-24.04
    needs: testes-unidade
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Subir Postgres
        run: docker compose up -d --wait db

      # A tag `integracao` e obrigatoria: sem ela estes testes nao compilam e o
      # job passaria verde sem nunca ter falado com o Postgres.
      - name: Rodar testes com DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_CI }}
        run: go test -tags=integracao ./tests/integracao/... -count=1 -race -v

      - name: Logs do Postgres
        if: failure()
        run: docker compose logs db

      - name: Derrubar Postgres
        if: always()
        run: docker compose down -v

  # ---- 5. Build --------------------------------------------------------------
  build:
    name: 5. Build — api e web
    runs-on: ubuntu-24.04
    needs: testes-integracao
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build da api
        working-directory: backend
        run: go build -o bin/api ./cmd/app

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  # ---- 6. Smoke test da stack completa ---------------------------------------
  smoke-docker:
    name: 6. Smoke test — docker compose
    runs-on: ubuntu-24.04
    needs: [build, versao]
    timeout-minutes: 20
    env:
      # Na main a imagem ja nasce com a versao da release, que o /health reporta;
      # fora dela fica vazia e a api mantem o padrao do codigo.
      DRIVEFLOW_VERSION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.versao.outputs.versao || '' }}
    steps:
      - uses: actions/checkout@v4

      # Builda as imagens de producao e so segue quando os healthchecks passam:
      # db aceitando conexoes e api respondendo /health com as migrations aplicadas.
      - name: Subir db, api e web
        run: docker compose up --build -d --wait --wait-timeout 180

      # Tudo passa pelo nginx do web, como no navegador: valida o proxy relativo
      # de /api e /health, as migrations e a gravacao real no Postgres.
      - name: Requisições pela stack
        run: |
          set -euo pipefail
          base=http://localhost:3000

          echo "GET / (SPA)"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$base/" | grep -q '<div id="root">'

          echo "GET /rota-inexistente (fallback da SPA)"
          curl -fsS "$base/rota-inexistente" | grep -q '<div id="root">'

          echo "GET /health"
          health=$(curl -fsS "$base/health")
          echo "$health"
          if [ -n "$DRIVEFLOW_VERSION" ]; then
            echo "$health" | jq -e --arg v "$DRIVEFLOW_VERSION" '.versao == $v'
          fi

          echo "POST /api/empresas"
          company=$(curl -fsS -X POST "$base/api/empresas" \
            -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Smoke CI\",\"cnpj\":\"$(date +%s%N | cut -c1-14)\"}")
          echo "$company"
          company_id=$(echo "$company" | jq -er '.id')

          echo "GET /api/empresas/$company_id/veiculos"
          curl -fsS "$base/api/empresas/$company_id/veiculos"

      # O projeto se chama `driveflow`, entao o compose nomeia as imagens
      # driveflow-api e driveflow-web.
      - name: Exportar as imagens validadas
        run: docker save driveflow-api driveflow-web | gzip > imagens.tar.gz

      # Entrada do CD e tambem artefato de entrega alternativo:
      #   gunzip -c imagens.tar.gz | docker load
      - uses: actions/upload-artifact@v4
        with:
          name: imagens-docker
          path: imagens.tar.gz
          retention-days: 30

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # ---- 7. CD: publicacao no Docker Hub ---------------------------------------
  publicar:
    name: 7. CD — publicar no Docker Hub
    runs-on: ubuntu-24.04
    needs: [smoke-docker, versao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagens-docker

      - name: Carregar as imagens validadas no CI
        run: gunzip -c imagens.tar.gz | docker load

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Um unico repositorio publico (o plano gratuito do Docker Hub nao deixou
      # tornar publico um segundo), com o servico no prefixo da tag:
      # <servico>-v<versao>, a release; <servico>-<sha do commit>, rastreavel;
      # e <servico>-latest, que o docker-compose.prod.yml usa por padrao.
      - name: Tag e push
        env:
          REPOSITORIO: ${{ secrets.DOCKERHUB_USERNAME }}/driveflow
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          for servico in api web; do
            for tag in "v$VERSAO" ${{ github.sha }} latest; do
              docker tag driveflow-$servico $REPOSITORIO:$servico-$tag
              docker push $REPOSITORIO:$servico-$tag
            done
          done

  # ---- 8. CD: tag e release no GitHub ---------------------------------------
  # So depois do push das imagens: a tag vX.Y.Z nunca aponta para uma versao
  # sem imagem no Docker Hub. As notas vem dos PRs mesclados desde a ultima tag.
  release:
    name: 8. CD — tag e release no GitHub
    runs-on: ubuntu-24.04
    needs: [publicar, versao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.versao.outputs.versao }}
    steps:
      # Um re-run encontra a release ja criada e segue sem duplicar.
      - name: Criar tag e release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DriveFlow $TAG" --generate-notes
          fi
          echo "### Release [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

  # ---- 9. CD: implantacao no runner self-hosted -----------------------------
  # Roda na maquina do runner registrado no repositorio (labels self-hosted,
  # Linux, X64): baixa do Docker Hub as imagens da release que acabou de ser
  # criada e sobe a stack de producao. O banco fica no volume, entre implantacoes.
  implantar:
    name: 9. CD — implantar no servidor self-hosted
    runs-on: [self-hosted, Linux, X64]
    needs: [release, versao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    env:
      # A tag da release, e nao `latest`, garante que sobe exatamente o que este run publicou.
      VERSAO: ${{ needs.versao.outputs.versao }}
      DRIVEFLOW_TAG: v${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      # Na primeira implantacao ainda nao ha stack: isso nao e falha.
      - name: Versão em execução (antes)
        run: |
          docker compose -f docker-compose.prod.yml ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          curl -fsS http://localhost:3000/health || echo "Nenhuma versão respondendo em :3000."

      - name: Baixar as imagens publicadas
        run: docker compose -f docker-compose.prod.yml pull

      - name: Subir a stack de produção
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180

      - name: Verificar pela stack
        run: |
          set -euo pipefail
          health=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/health)
          echo "$health"
          echo "$health" | jq -e --arg v "$VERSAO" '.versao == $v'
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'

      - name: Versão implantada
        run: |
          docker compose -f docker-compose.prod.yml ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          echo "### Implantado: $DRIVEFLOW_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos containers
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs
