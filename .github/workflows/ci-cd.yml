name: CI/CD

# Esteira unica: cada etapa so comeca quando a anterior termina com sucesso.
# A ordem vai do feedback mais barato para o mais caro, entao um erro de
# formatacao falha em segundos sem gastar minutos subindo Postgres e Docker.
#
#   1. analise estatica -> 2. seguranca -> 3. testes de unidade
#   -> 4. testes de integracao -> 5. build -> 6. smoke test da stack docker
#
# Etapas 1 a 6 sao o CI e rodam em todo push e PR. As etapas 7 e 8 sao o CD,
# so em push na main ou na homo: a 7 publica no Docker Hub as mesmas imagens
# que o smoke test validou (docker save/load), sem rebuild; a 8 implanta essas
# imagens na maquina do runner self-hosted.

on:
  push:
    branches: [dev, homo, main]
  pull_request:
    branches: [dev, homo, main]

# Um push novo na mesma branch cancela a esteira antiga, que ja esta obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DATABASE_URL_CI: postgres://driveflow:driveflow@localhost:5432/driveflow?sslmode=disable

jobs:
  # ---- 1. Analise estatica -------------------------------------------------
  analise-estatica:
    name: 1. Análise estática
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo para comparar as migrations com a branch alvo.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem formatação:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod e go.sum organizados
        working-directory: backend
        run: go mod tidy -diff

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # Sem a tag, os testes de integracao nao entram na compilacao e ficariam
      # sem analise estatica nenhuma.
      - name: go vet (testes de integracao)
        working-directory: backend
        run: go vet -tags=integracao ./...

      - name: staticcheck
        working-directory: backend
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest -tags=integracao ./...

      # As camadas internas nao podem depender de delivery nem de repository.
      - name: Direção das dependências entre camadas
        working-directory: backend
        run: |
          fail=0
          check() {
            pkg=$1; shift
            for forbidden in "$@"; do
              if go list -deps "./internal/$pkg" | grep -q "^driveflow/backend/internal/$forbidden"; then
                echo "internal/$pkg não pode importar internal/$forbidden"
                fail=1
              fi
            done
          }
          check entities usecases delivery repository
          check usecases delivery repository
          check repository usecases delivery
          exit $fail

      - name: Toda migration up tem a down correspondente
        working-directory: backend/internal/repository/migrations
        run: |
          fail=0
          for up in *.up.sql; do
            down="${up%.up.sql}.down.sql"
            [ -f "$down" ] || { echo "Falta $down"; fail=1; }
          done
          for down in *.down.sql; do
            up="${down%.down.sql}.up.sql"
            [ -f "$up" ] || { echo "Falta $up"; fail=1; }
          done
          exit $fail

      # Migrations ja aplicadas nunca sao editadas: so arquivos novos entram.
      - name: Migrations existentes não foram alteradas
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/${{ github.base_ref }}...HEAD" -- backend/internal/repository/migrations)
          if [ -n "$changed" ]; then
            echo "Migrations existentes foram alteradas ou removidas:"
            echo "$changed"
            echo "Crie uma nova migration NNNN_descricao.up.sql/.down.sql."
            exit 1
          fi

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Checagem de tipos (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Arquivos do Docker Compose válidos
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---- 2. Seguranca ----------------------------------------------------------
  seguranca:
    name: 2. Segurança das dependências
    runs-on: ubuntu-24.04
    needs: analise-estatica
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Aponta vulnerabilidades conhecidas que o codigo realmente alcanca,
      # tanto nos modulos quanto na biblioteca padrao da versao de Go usada.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # So as dependencias que vao para o bundle de producao.
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ---- 3. Testes de unidade --------------------------------------------------
  testes-unidade:
    name: 3. Testes de unidade
    runs-on: ubuntu-24.04
    needs: seguranca
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -race pega acesso concorrente sem sincronizacao (ex.: repositorio em
      # memoria); -shuffle expoe testes que dependem da ordem de execucao.
      # Os testes ficam em tests/, entao -coverpkg mede o codigo de internal/.
      - name: Backend (race + shuffle + cobertura)
        working-directory: backend
        run: |
          go test ./... -count=1 -race -shuffle=on \
            -coverpkg=./internal/...,./pkg/... -coverprofile=cobertura-unidade.out
          echo "### Cobertura do backend (unidade)" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cobertura-unidade.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --run

  # ---- 4. Testes de integracao -----------------------------------------------
  testes-integracao:
    name: 4. Testes de integração (Postgres)
    runs-on: ubuntu-24.04
    needs: testes-unidade
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Subir Postgres
        run: docker compose up -d --wait db

      # A tag `integracao` e obrigatoria: sem ela estes testes nao compilam e o
      # job passaria verde sem nunca ter falado com o Postgres.
      - name: Rodar testes com DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_CI }}
        run: go test -tags=integracao ./tests/integracao/... -count=1 -race -v

      - name: Logs do Postgres
        if: failure()
        run: docker compose logs db

      - name: Derrubar Postgres
        if: always()
        run: docker compose down -v

  # ---- 5. Build --------------------------------------------------------------
  build:
    name: 5. Build — api e web
    runs-on: ubuntu-24.04
    needs: testes-integracao
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build da api
        working-directory: backend
        run: go build -o bin/api ./cmd/app

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  # ---- 6. Smoke test da stack completa ---------------------------------------
  smoke-docker:
    name: 6. Smoke test — docker compose
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Builda as imagens de producao e so segue quando os healthchecks passam:
      # db aceitando conexoes e api respondendo /health com as migrations aplicadas.
      - name: Subir db, api e web
        run: docker compose up --build -d --wait --wait-timeout 180

      # Tudo passa pelo nginx do web, como no navegador: valida o proxy relativo
      # de /api e /health, as migrations e a gravacao real no Postgres.
      - name: Requisições pela stack
        run: |
          set -euo pipefail
          base=http://localhost:3000

          echo "GET / (SPA)"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$base/" | grep -q '<div id="root">'

          echo "GET /rota-inexistente (fallback da SPA)"
          curl -fsS "$base/rota-inexistente" | grep -q '<div id="root">'

          echo "GET /health"
          curl -fsS "$base/health"

          echo "POST /api/empresas"
          company=$(curl -fsS -X POST "$base/api/empresas" \
            -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Smoke CI\",\"cnpj\":\"$(date +%s%N | cut -c1-14)\"}")
          echo "$company"
          company_id=$(echo "$company" | jq -er '.id')

          echo "GET /api/empresas/$company_id/veiculos"
          curl -fsS "$base/api/empresas/$company_id/veiculos"

      # O projeto se chama `driveflow`, entao o compose nomeia as imagens
      # driveflow-api e driveflow-web.
      - name: Exportar as imagens validadas
        run: docker save driveflow-api driveflow-web | gzip > imagens.tar.gz

      # Entrada do CD e tambem artefato de entrega alternativo:
      #   gunzip -c imagens.tar.gz | docker load
      - uses: actions/upload-artifact@v4
        with:
          name: imagens-docker
          path: imagens.tar.gz
          retention-days: 30

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # ---- 7. CD: publicacao no Docker Hub ---------------------------------------
  publicar:
    name: 7. CD — publicar no Docker Hub
    runs-on: ubuntu-24.04
    needs: smoke-docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homo')
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagens-docker

      - name: Carregar as imagens validadas no CI
        run: gunzip -c imagens.tar.gz | docker load

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Um unico repositorio publico (o plano gratuito do Docker Hub nao deixou
      # tornar publico um segundo), com o servico no prefixo da tag:
      # <servico>-<sha do commit>, rastreavel, e <servico>-latest, que o
      # docker-compose.prod.yml usa por padrao. So a main move o latest: um
      # push em homo publica apenas o SHA, que o job 8 implanta.
      - name: Tag e push
        env:
          REPOSITORIO: ${{ secrets.DOCKERHUB_USERNAME }}/driveflow
          TAGS: ${{ github.sha }}${{ github.ref == 'refs/heads/main' && ' latest' || '' }}
        run: |
          for servico in api web; do
            for tag in $TAGS; do
              docker tag driveflow-$servico $REPOSITORIO:$servico-$tag
              docker push $REPOSITORIO:$servico-$tag
            done
          done

  # ---- 8. CD: implantacao no runner self-hosted -----------------------------
  # Roda na maquina do runner registrado no repositorio (labels self-hosted,
  # Linux, X64): baixa do Docker Hub as imagens que acabaram de ser publicadas
  # e sobe a stack de producao. O banco fica no volume, entre implantacoes.
  implantar:
    name: 8. CD — implantar no servidor self-hosted
    runs-on: [self-hosted, Linux, X64]
    needs: publicar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homo')
    timeout-minutes: 15
    env:
      # O SHA, e nao `latest`, garante que sobe exatamente o que este run publicou.
      DRIVEFLOW_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar as imagens publicadas
        run: docker compose -f docker-compose.prod.yml pull

      - name: Subir a stack de produção
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180

      - name: Verificar pela stack
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'

      - name: Logs dos containers
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs
