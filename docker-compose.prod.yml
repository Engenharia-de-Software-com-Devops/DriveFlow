# Sobe o DriveFlow a partir das imagens publicadas no Docker Hub pelo CD,
# sem buildar nada localmente:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# As duas imagens ficam no mesmo repositorio, jaimegdj/driveflow, com o servico
# no prefixo da tag (api-..., web-...). DRIVEFLOW_TAG escolhe a versao: `latest`
# (padrao), uma release (`v0.2.0`) ou o SHA de um commit da main; as duas
# ultimas tambem servem de rollback.
name: driveflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driveflow}
      POSTGRES_DB: ${POSTGRES_DB:-driveflow}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    # Sem ports: o banco so e acessivel pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driveflow} -d ${POSTGRES_DB:-driveflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  api:
    image: jaimegdj/driveflow:api-${DRIVEFLOW_TAG:-latest}
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-driveflow}:${POSTGRES_PASSWORD:-driveflow}@db:5432/${POSTGRES_DB:-driveflow}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 50M
        reservations:
          cpus: '0.25'
          memory: 20M

  web:
    image: jaimegdj/driveflow:web-${DRIVEFLOW_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 50M
        reservations:
          cpus: '0.25'
          memory: 20M

volumes:
  dados_postgres:
